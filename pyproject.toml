[project]
name = "tracepath"
version = "0.1.0"
description = "Answers \"why was this built this way?\" from a project's decision records"
readme = "README.md"
authors = [
    { name = "Ghaly Nicolas Jules", email = "mghalynho@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "neo4j>=6.3.1",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
tracepath = "tracepath.cli:app"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# E/F/W: pycodestyle + pyflakes · I: import order · B: bugbear · UP: modern syntax
# SIM: simplifications · RUF: ruff's own · D: docstrings on public modules and functions
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = ["integration: needs a running Neo4j (docker compose up -d)"]

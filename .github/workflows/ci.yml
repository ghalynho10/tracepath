name: CI

on:
  # Push runs on main only, so a pull request is checked once, by its own pull_request run.
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Pinned rather than ubuntu-latest, which moves to Ubuntu 26 from 2026-10-19, so
    # the runner image does not change under an open feature branch.
    runs-on: ubuntu-24.04
    services:
      # Integration tests run real Cypher against a real Neo4j, never a mocked driver.
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/ci-test-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ci-test-password
      NEO4J_DATABASE: neo4j
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy
      # Not paths-ignore: main requires this job, and a skipped workflow would block the merge.
      # Any failure to work out the changed files leaves docs_only unset, so the suite runs.
      - name: Detect documentation only change
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          files="$(git diff --name-only "$BASE...$HEAD" 2>/dev/null || git diff --name-only "$BASE" "$HEAD" 2>/dev/null || true)"
          if [ -z "$files" ]; then
            echo "No changed files found, running the full suite."
            exit 0
          fi
          echo "Changed files:"
          echo "$files"
          if echo "$files" | grep -qvE '^(docs/|[^/]+\.md$)'; then
            echo "A file outside docs/ and top level .md changed, running the full suite."
          else
            echo "Only docs/ and top level .md files changed, skipping the Test step."
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Test
        if: steps.changes.outputs.docs_only != 'true'
        run: uv run pytest

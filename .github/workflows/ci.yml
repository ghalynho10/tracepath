name: CI

on:
  push:
  pull_request:

jobs:
  check:
    # Pinned rather than ubuntu-latest, which moves to Ubuntu 26 from 2026-10-19, so
    # the runner image does not change under an open feature branch.
    runs-on: ubuntu-24.04
    services:
      # Integration tests run real Cypher against a real Neo4j, never a mocked driver.
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/ci-test-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ci-test-password
      NEO4J_DATABASE: neo4j
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy
      - name: Test
        run: uv run pytest
